name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js","./dist/agent-context.js","./dist/agent-guide-audit.js","./dist/authoring.js","./dist/benchmark.js","./dist/clip/browser-profiles.js","./dist/capture.js","./dist/cli.js","./dist/clip/acquire.js","./dist/clip/args.js","./dist/clip/bounded-byte-buffer.js","./dist/clip/cli.js","./dist/clip/cookies.js","./dist/clip/doctor.js","./dist/clip/network.js","./dist/clip/network-proxy.js","./dist/clip/persist.js","./dist/clip/terminal.js","./dist/git.js","./dist/graph.js","./dist/navigation.js","./dist/pdf.js","./dist/percolate.js","./dist/query.js","./dist/sdk.js","./dist/search.js","./dist/semantic.js","./dist/workflow.js","./dist/workflows/index.js","./dist/workflows/decision-context.js","./dist/workflows/explain-change.js","./dist/workflows/plan-radar.js"].map((path) => import(path)))'
